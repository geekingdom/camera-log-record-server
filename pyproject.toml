[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-log-record-server"
version = "0.1.0"
description = "Ordered device log collection and hourly archives"
requires-python = ">=3.12"
# HTTPcore 在热路径识别异步环境；显式安装 sniffio 避免每次缺失导入都扫描模块路径。
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pymongo>=4.11,<5", "pydantic-settings>=2.8,<3", "cryptography>=44", "asyncssh>=2.20,<3", "telnetlib3==2.6.1", "httpx>=0.28,<1", "sniffio>=1.3.1,<2", "prometheus-client>=0.21,<1", "defusedxml>=0.7,<1", "psutil>=6,<8", "regex>=2025.1,<2027"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11", "mongomock-motor>=0.0.35"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
