# Linux 独立采集节点；HOST_LOG_ROOT 为日志/归档/下载临时文件所在宿主机目录。
services:
  storage-init:
    image: alpine:3.21
    user: "0:0"
    restart: "no"
    command: ["sh", "-ec", "mkdir -p /data/data /data/service-logs; chown 10001:10001 /data /data/data /data/service-logs"]
    volumes: ["${HOST_LOG_ROOT:-worker-data}:/data"]
  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-http://af.hikvision.com.cn/artifactory/api/pypi/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-af.hikvision.com.cn}
    env_file: ${DEPLOY_ENV_FILE:-../.env.worker}
    environment:
      MONGO_URI: ${MONGO_URI:?请填写与后端相同的MongoDB副本集}
      NODE_ID: ${NODE_ID:?请填写稳定且唯一的节点ID}
      NODE_URL: ${NODE_URL:?请填写后端可达的节点URL}
      NODE_PORT: ${NODE_PORT:-18081}
      HOST_PROC_ROOT: /host/proc
      LOG_ROOT: /var/lib/camera-logs/data
      KNOWN_HOSTS: /etc/camera-logs/known_hosts
      NFS_ROOT: ${NFS_ROOT:-/srv/camera-logs/nfs-coredump}
      NFS_SERVER_IP: ${NFS_SERVER_IP:-}
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 120s
    depends_on: {storage-init: {condition: service_completed_successfully}}
    volumes:
      - ${HOST_LOG_ROOT:-worker-data}:/var/lib/camera-logs
      # 主机指标只读，不授予容器修改主机配置的权限。
      - /proc:/host/proc:ro
      - ${NFS_ROOT:-/srv/camera-logs/nfs-coredump}:${NFS_ROOT:-/srv/camera-logs/nfs-coredump}
      - ${KNOWN_HOSTS_FILE:-./known_hosts.example}:/etc/camera-logs/known_hosts:ro
    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}
volumes:
  worker-data:
