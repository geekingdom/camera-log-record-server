# 单独前端；不会隐式创建 API、节点或数据库。BACKEND_UPSTREAM 必须可从容器访问。
services:
  frontend:
    build: {context: .., dockerfile: deploy/frontend.Dockerfile}
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:?请在前端配置中填写后端地址}
    ports: ["${FRONTEND_PORT:-5173}:80"]
    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
