# 每台 Linux 主机仅运行一个实例，配置稳定唯一 NODE_ID 与内部可路由 NODE_URL。
services:
  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    env_file: ../.env
    environment:
      NODE_ID: ${NODE_ID:?Set a stable unique NODE_ID for this host}
      NODE_URL: ${NODE_URL:?Set a stable NODE_URL reachable by the API}
      HOST_PROC_ROOT: /host/proc
      LOG_ROOT: /var/lib/camera-logs/data
      KNOWN_HOSTS: /etc/camera-logs/known_hosts
      NFS_ROOT: ${NFS_ROOT:-/srv/camera-logs/nfs-coredump}
      NFS_SERVER_IP: ${NFS_SERVER_IP:-}
    network_mode: host
    restart: unless-stopped
    volumes:
      - ${HOST_LOG_ROOT:-/srv/camera-logs}:/var/lib/camera-logs
      # 主机指标只读；采样失败时展示未知，不按空闲节点调度。
      - /proc:/host/proc:ro
      - ${NFS_ROOT:-/srv/camera-logs/nfs-coredump}:${NFS_ROOT:-/srv/camera-logs/nfs-coredump}
      # 默认账号密码模式无需主机公钥文件；仅严格模式需要覆盖为已确认的文件。
      - ${KNOWN_HOSTS_FILE:-./known_hosts.example}:/etc/camera-logs/known_hosts:ro
