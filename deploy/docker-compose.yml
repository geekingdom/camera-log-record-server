services:
  storage-init:
    image: alpine:3.21
    user: "0:0"
    restart: "no"
    # 只初始化挂载根及固定子目录权限，不递归修改已有设备日志。
    command: ["sh", "-ec", "mkdir -p /api/data /api/service-logs /worker/data /worker/service-logs; chown 10001:10001 /api /api/data /api/service-logs /worker /worker/data /worker/service-logs"]
    volumes:
      - ${API_DATA_ROOT:-api-data}:/api
      - ${HOST_LOG_ROOT:-worker-data}:/worker
  mongo1:
    image: mongo:7.0
    restart: unless-stopped
    logging: &service-logging
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: ["${MONGO_DATA_1:-mongo1-data}:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [camera-logs]
  mongo2:
    image: mongo:7.0
    restart: unless-stopped
    logging: *service-logging
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: ["${MONGO_DATA_2:-mongo2-data}:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [camera-logs]
  mongo3:
    image: mongo:7.0
    restart: unless-stopped
    logging: *service-logging
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: ["${MONGO_DATA_3:-mongo3-data}:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [camera-logs]
  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo1: { condition: service_healthy }
      mongo2: { condition: service_healthy }
      mongo3: { condition: service_healthy }
    volumes:
      - ./mongo-init.js:/scripts/mongo-init.js:ro
    command: ["mongosh", "mongodb://mongo1:27017/admin", "/scripts/mongo-init.js"]
    restart: "no"
    logging: *service-logging
    networks: [camera-logs]
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    env_file: ${DEPLOY_ENV_FILE:-../.env}
    restart: unless-stopped
    logging: *service-logging
    environment:
      MONGO_URI: ${COMPOSE_MONGO_URI:-mongodb://mongo1:27017,mongo2:27017,mongo3:27017/camera_logs?replicaSet=rs0}
      DATABASE_NAME: ${DATABASE_NAME:-camera_logs}
      API_PORT: 8000
      # API 不对宿主机发布端口，只接收受控容器网络内的代理请求。
      FORWARDED_ALLOW_IPS: "*"
      LOG_ROOT: /var/lib/camera-logs/data
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
    expose: ["8000"]
    volumes: ["${API_DATA_ROOT:-api-data}:/var/lib/camera-logs"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [camera-logs]
  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    env_file: ${DEPLOY_ENV_FILE:-../.env}
    restart: unless-stopped
    logging: *service-logging
    environment:
      MONGO_URI: ${COMPOSE_MONGO_URI:-mongodb://mongo1:27017,mongo2:27017,mongo3:27017/camera_logs?replicaSet=rs0}
      DATABASE_NAME: ${DATABASE_NAME:-camera_logs}
      LOG_ROOT: /var/lib/camera-logs/data
      NODE_ID: ${COLLECTOR_NODE_ID:-compose-worker-1}
      NODE_URL: ${COLLECTOR_NODE_URL:-http://worker:8001}
      KNOWN_HOSTS: /etc/camera-logs/known_hosts
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
    # 默认单节点使用稳定身份与命名卷；多机扩容使用 worker-node.yml 独立部署。
    volumes:
      - ${HOST_LOG_ROOT:-worker-data}:/var/lib/camera-logs
      - ${KNOWN_HOSTS_FILE:-./known_hosts.example}:/etc/camera-logs/known_hosts:ro
    networks: [camera-logs]
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: http://api:8000
    logging: *service-logging
    depends_on:
      api: { condition: service_healthy }
    ports: ["${FRONTEND_PORT:-5173}:80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [camera-logs]

volumes:
  api-data:
  worker-data:
  mongo1-data:
  mongo2-data:
  mongo3-data:

networks:
  camera-logs:
    driver: bridge
