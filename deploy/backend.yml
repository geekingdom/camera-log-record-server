# Linux 独立 API 与调度器；通过 MONGO_URI 使用已有副本集，不启动本地数据库。
services:
  storage-init:
    image: alpine:3.21
    user: "0:0"
    restart: "no"
    command: ["sh", "-ec", "mkdir -p /data/data /data/service-logs; chown 10001:10001 /data /data/data /data/service-logs"]
    volumes: ["${API_DATA_ROOT:-api-data}:/data"]
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-http://af.hikvision.com.cn/artifactory/api/pypi/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-af.hikvision.com.cn}
    env_file: ${DEPLOY_ENV_FILE:-../.env.backend}
    environment:
      MONGO_URI: ${MONGO_URI:?请填写可达的MongoDB副本集地址}
      API_BIND_IP: ${API_BIND_IP:-127.0.0.1}
      API_PORT: ${API_PORT:-18080}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      LOG_ROOT: /var/lib/camera-logs/data
    command: ["sh", "-ec", "exec uvicorn camera_logs.main:app --host \"$$API_BIND_IP\" --port \"$$API_PORT\""]
    network_mode: host
    restart: unless-stopped
    depends_on: {storage-init: {condition: service_completed_successfully}}
    volumes: ["${API_DATA_ROOT:-api-data}:/var/lib/camera-logs"]
    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; host=os.environ['API_BIND_IP']; host='127.0.0.1' if host=='0.0.0.0' else host; urllib.request.urlopen('http://'+host+':'+os.environ['API_PORT']+'/health',timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  api-data:
