<text x="765" y="595" class="label" text-anchor="middle">可重建索引</text>
<rect x="40" y="100" width="220" height="100" rx="10" fill="#142034" stroke="#22d3ee" stroke-width="1.6"/>
<text x="150.0" y="129" fill="#22d3ee" font-size="18" font-weight="600" text-anchor="middle">浏览器 / 第三方</text>
<text x="150.0" y="154" class="label" text-anchor="middle">Vue 3 控制台、REST 调用</text>
<text x="150.0" y="176" class="label" text-anchor="middle">用户操作与实时日志订阅</text>
<rect x="390" y="100" width="300" height="100" rx="10" fill="#142034" stroke="#34d399" stroke-width="1.6"/>
<text x="540.0" y="129" fill="#34d399" font-size="18" font-weight="600" text-anchor="middle">FastAPI 公共入口</text>
<text x="540.0" y="154" class="label" text-anchor="middle">鉴权、任务控制、目录与作业</text>
<text x="540.0" y="176" class="label" text-anchor="middle">按节点归属代理内容下载</text>
<rect x="840" y="100" width="240" height="100" rx="10" fill="#142034" stroke="#a78bfa" stroke-width="1.6"/>
<text x="960.0" y="129" fill="#a78bfa" font-size="18" font-weight="600" text-anchor="middle">MongoDB 副本集</text>
<text x="960.0" y="154" class="label" text-anchor="middle">配置、运行、租约、目录、审计</text>
<text x="960.0" y="176" class="label" text-anchor="middle">不保存设备原始日志正文</text>
<rect x="40" y="330" width="220" height="100" rx="10" fill="#142034" stroke="#22d3ee" stroke-width="1.6"/>
<text x="150.0" y="359" fill="#22d3ee" font-size="18" font-weight="600" text-anchor="middle">设备 / 串口服务器</text>
<text x="150.0" y="384" class="label" text-anchor="middle">SSH / Telnet 输出</text>
<text x="150.0" y="406" class="label" text-anchor="middle">网络设备可写入 Core NFS</text>
<rect x="390" y="330" width="300" height="100" rx="10" fill="#142034" stroke="#34d399" stroke-width="1.6"/>
<text x="540.0" y="359" fill="#34d399" font-size="18" font-weight="600" text-anchor="middle">Worker 采集节点</text>
<text x="540.0" y="384" class="label" text-anchor="middle">领取、心跳、连接、采集与归档</text>
<text x="540.0" y="406" class="label" text-anchor="middle">单接收器 / 单命令队列 / 顺序写</text>
<rect x="840" y="330" width="240" height="100" rx="10" fill="#142034" stroke="#a78bfa" stroke-width="1.6"/>
<text x="960.0" y="359" fill="#a78bfa" font-size="18" font-weight="600" text-anchor="middle">本节点 LOG_ROOT</text>
<text x="960.0" y="384" class="label" text-anchor="middle">日志分片、小时归档</text>
<text x="960.0" y="406" class="label" text-anchor="middle">下载制品与恢复清单</text>
<rect x="40" y="560" width="220" height="100" rx="10" fill="#142034" stroke="#fbbf24" stroke-width="1.6"/>
<text x="150.0" y="589" fill="#fbbf24" font-size="18" font-weight="600" text-anchor="middle">Core NFS 源目录</text>
<text x="150.0" y="614" class="label" text-anchor="middle">设备产生的 Coredump</text>
<text x="150.0" y="636" class="label" text-anchor="middle">与普通采集日志目录分开</text>
<rect x="390" y="560" width="300" height="100" rx="10" fill="#142034" stroke="#fbbf24" stroke-width="1.6"/>
<text x="540.0" y="589" fill="#fbbf24" font-size="18" font-weight="600" text-anchor="middle">独立 Indexer（可选）</text>
<text x="540.0" y="614" class="label" text-anchor="middle">读取节点日志及 Mongo 元数据</text>
<text x="540.0" y="636" class="label" text-anchor="middle">检查点、回放与幂等索引</text>
<rect x="840" y="560" width="240" height="100" rx="10" fill="#142034" stroke="#fbbf24" stroke-width="1.6"/>
<text x="960.0" y="589" fill="#fbbf24" font-size="18" font-weight="600" text-anchor="middle">Elasticsearch（可选）</text>
<text x="960.0" y="614" class="label" text-anchor="middle">日志正文检索副本</text>
<text x="960.0" y="636" class="label" text-anchor="middle">独立保留、可重建</text>
<text x="40" y="715" class="label">普通日志无需跨节点共享目录；API 通过 Worker 内部接口读取对应节点文件。</text><text x="40" y="741" class="label">Core NFS 仅用于设备 Core 源文件。索引不可用或不完整时回退原文扫描，不阻断采集。</text></svg>
