<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc"><title id="title">平台组件与数据流</title><desc id="desc">API、Worker、节点文件、MongoDB、设备 Core NFS 与可选独立索引器的连接关系。</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4 0 8z" fill="#94a3b8"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif}.label{fill:#cbd5e1;font-size:13px}.edge{fill:none;stroke:#94a3b8;stroke-width:1.6;marker-end:url(#a)}</style></defs><rect width="1120" height="800" fill="#0f172a"/><rect width="1120" height="800" fill="url(#grid)"/><text x="40" y="40" fill="white" font-size="24" font-weight="700">平台组件与数据流</text><text x="40" y="67" class="label">控制面保存元数据；每个 Worker 独立持有日志；检索索引为可选旁路。</text>
<path d="M260 150H390" class="edge"/>
<text x="325" y="135" class="label" text-anchor="middle">HTTPS / WS</text>
<path d="M690 150H840" class="edge"/>
