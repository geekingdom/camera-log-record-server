<path d="M540 200V330" class="edge" marker-start="url(#a)"/>
<text x="625" y="270" class="label" text-anchor="middle">内部转发 / 文件读取</text>
<path d="M390 380H260" class="edge"/>
<text x="325" y="363" class="label" text-anchor="middle">主动 SSH / Telnet</text>
<path d="M690 380H840" class="edge"/>
<text x="765" y="363" class="label" text-anchor="middle">顺序写入</text>
<path d="M690 350H770V230H940V200" class="edge"/>
<text x="864" y="250" class="label" text-anchor="middle">心跳 / 领取 / 目录</text>
