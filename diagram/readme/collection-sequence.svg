<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" role="img" aria-labelledby="title desc">
  <title id="title">日志采集时序</title>
  <desc id="desc">单会话接收器、共享命令队列、缓冲批写、归档和实时 WebSocket 的顺序关系。</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0L9 4 0 8z" fill="#94a3b8"/>
    </marker>
    <style>text{font-family:'Noto Sans SC','PingFang SC',sans-serif;letter-spacing:0}.t{fill:#fff;font-size:16px;font-weight:700}.n{fill:#fff;font-size:12px;font-weight:700}.s{fill:#cbd5e1;font-size:10px}.life{stroke:#334155;stroke-dasharray:6 4}.m{stroke:#94a3b8;stroke-width:1.5;marker-end:url(#a)}.back{stroke:#64748b;stroke-width:1.2;stroke-dasharray:5 3;marker-end:url(#a)}.act{fill:#083344;stroke:#22d3ee}</style>
  </defs>
  <rect width="1160" height="760" fill="#0f172a"/>
  <text x="36" y="40" class="t">采集会话：单接收者与同一命令队列</text>
  <text x="36" y="61" class="s">时间从上到下。设备输出不因命令发送而另建连接。</text>
  <g>
    <rect x="45" y="88" width="130" height="46" rx="6" fill="#1e293b" stroke="#94a3b8"/>
    <text x="110" y="116" class="n" text-anchor="middle">设备</text>
    <rect x="250" y="88" width="140" height="46" rx="6" fill="#064e3b" stroke="#34d399"/>
    <text x="320" y="116" class="n" text-anchor="middle">Collector</text>
    <rect x="485" y="88" width="140" height="46" rx="6" fill="#78350f" stroke="#fbbf24"/>
    <text x="555" y="116" class="n" text-anchor="middle">缓冲与写盘</text>
    <rect x="720" y="88" width="140" height="46" rx="6" fill="#2e1065" stroke="#a78bfa"/>
    <text x="790" y="116" class="n" text-anchor="middle">节点本地日志</text>
    <rect x="955" y="88" width="140" height="46" rx="6" fill="#083344" stroke="#22d3ee"/>
    <text x="1025" y="116" class="n" text-anchor="middle">浏览器</text>
  </g>
  <g class="life">
    <path d="M110 134V720M320 134V720M555 134V720M790 134V720M1025 134V720"/>
  </g>
  <rect x="315" y="163" width="10" height="438" class="act"/>
  <rect x="550" y="356" width="10" height="175" class="act"/>
  <path d="M320 180H110" class="m"/>
  <text x="215" y="170" class="s" text-anchor="middle">建立一条采集连接</text>
  <path d="M320 225H110" class="m"/>
  <text x="215" y="215" class="s" text-anchor="middle">初始化命令（唯一发送队列）</text>
  <path d="M110 270H320" class="m"/>
  <text x="215" y="260" class="s" text-anchor="middle">原始字节流</text>
  <path d="M320 315H1025" class="m"/>
  <text x="672" y="305" class="s" text-anchor="middle">加上海时区行前缀；实时消息由 API 转发</text>
  <path d="M320 360H555" class="m"/>
  <text x="438" y="350" class="s" text-anchor="middle">按接收顺序写入有界缓冲</text>
  <rect x="450" y="385" width="270" height="108" rx="5" fill="none" stroke="#64748b" stroke-dasharray="5 3"/>
  <text x="465" y="405" class="s">loop 每批 / 到小时边界</text>
  <path d="M555 430H790" class="m"/>
  <text x="672" y="420" class="s" text-anchor="middle">批写原始片段</text>
  <path d="M320 475H110" class="m"/>
  <text x="215" y="465" class="s" text-anchor="middle">手工或定时命令（同一队列）</text>
  <path d="M110 520H320" class="m"/>
  <text x="215" y="510" class="s" text-anchor="middle">后续输出仍由同一接收器读取</text>
  <path d="M320 575H790" class="m"/>
  <text x="555" y="565" class="s" text-anchor="middle">关闭、同步、压缩、校验后原子发布小时归档</text>
  <path d="M790 620H320" class="back"/>
  <text x="555" y="610" class="s" text-anchor="middle">归档目录 READY / 文件元数据登记</text>
  <path d="M320 665H1025" class="m"/>
  <text x="672" y="655" class="s" text-anchor="middle">实时状态与历史目录可查询</text>
  <text x="580" y="718" class="s" text-anchor="middle">失败的归档保留源数据，恢复流程继续登记或重试发布。</text>
</svg>
