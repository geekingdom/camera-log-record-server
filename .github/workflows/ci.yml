name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: pytest
      - run: ruff check backend tests scripts
      - name: 检查Docker构建上下文排除规则
        run: python scripts/verify_build_context.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: 验证副本集初始化门槛
        run: node --test ../tests/deploy/test_mongo_init.mjs
      - run: npm run build
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查中文提交标题和详细正文
        run: python scripts/check_commit_history.py
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: camera-log-ci
      FRONTEND_PORT: '15173'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - name: 一键部署并验证重复运行保留密钥与卷
        run: |
          ./deploy.sh
          first_env_digest="$(sha256sum .env | awk '{print $1}')"
          docker volume inspect camera-log-ci_mongo1-data > /dev/null
          ./deploy.sh
          test "$first_env_digest" = "$(sha256sum .env | awk '{print $1}')"
      - name: 验证代理采集命令与归档下载链路
        run: |
          gateway="$(docker network inspect camera-log-ci_camera-logs --format '{{(index .IPAM.Config 0).Gateway}}')"
          python scripts/verify_container_service.py --url http://127.0.0.1:15173 --device-host "$gateway" --check-frontend
      - name: 验证内置管理员、只读子账号与会话停用
        run: python scripts/verify_user_auth.py --isolated --url http://127.0.0.1:15173 --env-file .env
      - name: 验证真实副本集隔离事务和心跳冲突
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_isolation_transaction.py
      - name: 验证调度取消和租约接管的事务一致性
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_scheduler_transaction.py
      - name: 验证定时预算与执行记录事务一致性
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_command_reservation.py
      - name: 验证手动命令并发准入事务
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_manual_admission.py
      - name: 验证资源模板账户审计事务与幂等恢复
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_audited_mutations.py
      - name: 验证真实数据库日志目录尾部水位
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_catalog_watermarks.py
      - name: 验证多路真实协议分卷与归档完整性
        run: |
          gateway="$(docker network inspect camera-log-ci_camera-logs --format '{{(index .IPAM.Config 0).Gateway}}')"
          python scripts/benchmark_service.py --url http://127.0.0.1:15173 --device-host "$gateway" --bind-host 0.0.0.0 --routes 8 --seconds 60 --realtime-clients-per-route 1 --search-interval 5 --output .local/service-benchmark-ci
      - name: 收集容器诊断日志
        if: failure()
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml logs --no-color --tail 150 api worker mongo-init frontend
      - name: 清理隔离容器与测试卷
        if: always()
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml down --volumes --remove-orphans
