name: CI

on:
  push:
  pull_request:

jobs:
  cross-worker-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - name: 启动仅本机可达的临时副本集
        run: |
          docker run --detach --name gap-mongo --network host mongo:7.0 --replSet rs0 --bind_ip 127.0.0.1
          python - <<'PY'
          import time
          from pymongo import MongoClient
          client = MongoClient('mongodb://127.0.0.1:27017/?directConnection=true', serverSelectionTimeoutMS=1000)
          deadline = time.monotonic() + 60
          while True:
              try:
                  client.admin.command('ping')
                  break
              except Exception:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(1)
          client.admin.command('replSetInitiate', {'_id': 'rs0', 'members': [{'_id': 0, 'host': '127.0.0.1:27017'}]})
          while not client.admin.command('hello').get('isWritablePrimary'):
              if time.monotonic() >= deadline:
                  raise TimeoutError('临时副本集未选出主节点')
              time.sleep(.2)
          client.close()
          PY
      - name: 验证双Worker目录补读与节点故障隔离
        run: python scripts/verify_cross_worker_gap.py
      - name: 回收临时数据库容器
        if: always()
        run: docker rm -fv gap-mongo
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: pytest
      - run: ruff check backend tests scripts
      - name: 检查Docker构建上下文排除规则
        run: python scripts/verify_build_context.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 安装 API 文档目录生成依赖
        run: cd .. && python -m pip install '.[test]'
      - run: npm test
      - name: 验证副本集初始化门槛
        run: node --test ../tests/deploy/test_mongo_init.mjs ../tests/deploy/test_mongo_standalone.mjs
      - run: npm run build
      - name: 安装浏览器中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: 验证普通HTTP服务器IP浏览器写操作
        run: |
          npm install --prefix "$RUNNER_TEMP/http-browser" playwright@1.58.2 --no-audit --no-fund
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/http-browser/node_modules/playwright/index.mjs" node ../scripts/verify_http_browser.mjs
      - name: 验证生产页面布局与日志工作台交互
        run: PYTHON_BIN=python PLAYWRIGHT_MODULE="$RUNNER_TEMP/http-browser/node_modules/playwright/index.mjs" node scripts/verify-workspace.mjs
      - name: 保存布局验收截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-browser-screenshots
          path: output/playwright/
          if-no-files-found: ignore
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查中文提交标题和详细正文
        run: python scripts/check_commit_history.py
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: camera-log-ci
      FRONTEND_PORT: '15173'
      # GitHub runner无法访问公司内网制品库，显式覆盖镜像构建参数；生产部署不继承此覆盖。
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_TRUSTED_HOST: pypi.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - name: 一键部署并验证重复运行保留密钥与卷
        run: |
          ./deploy.sh
          first_env_digest="$(sha256sum .env | awk '{print $1}')"
          docker volume inspect camera-log-ci_mongo1-data > /dev/null
          ./deploy.sh
          test "$first_env_digest" = "$(sha256sum .env | awk '{print $1}')"
      - name: 验证完整部署HTTP节点登记保存与持续心跳
        run: python scripts/verify_node_registration.py --isolated --url http://127.0.0.1:15173
      - name: 验证代理采集命令与归档下载链路
        run: |
          gateway="$(docker network inspect camera-log-ci_camera-logs --format '{{(index .IPAM.Config 0).Gateway}}')"
          python scripts/verify_container_service.py --url http://127.0.0.1:15173 --device-host "$gateway" --check-frontend
      - name: 验证内置管理员、只读子账号与会话停用
        run: python scripts/verify_user_auth.py --isolated --url http://127.0.0.1:15173 --env-file .env
      - name: 验证真实副本集隔离事务和心跳冲突
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_isolation_transaction.py
      - name: 验证跨进程设备SSH五连接名额
        # spawn子进程需要真实脚本路径，不能像普通事务验证器一样从stdin执行。
        run: |
          docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml cp scripts/verify_ssh_admission.py api:/tmp/verify_ssh_admission.py
          docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python /tmp/verify_ssh_admission.py
      - name: 验证真实SSH连接限额与关闭释放
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_ssh_socket_admission.py
      - name: 验证调度取消和租约接管的事务一致性
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_scheduler_transaction.py
      - name: 验证节点速率动态配置与事务竞争
        run: |
          docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml cp scripts/verify_scheduler_transaction.py api:/tmp/verify_scheduler_transaction.py
          docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml cp scripts/verify_input_admission.py api:/tmp/verify_input_admission.py
          docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python /tmp/verify_input_admission.py
      - name: 验证增长记录分段归档回滚及维护索引
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_growth_records.py
      - name: 验证定时预算与执行记录事务一致性
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_command_reservation.py
      - name: 验证手动命令并发准入事务
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_manual_admission.py
      - name: 验证手动命令入队与审计原子提交
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_manual_submission.py
      - name: 验证服务令牌创建撤销与审计原子提交
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_service_token_audit.py
      - name: 验证节点删除与调度竞争及历史保留
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_node_deletion.py
      - name: 验证日志作业文件保护与审计事务
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_job_submission.py
      - name: 验证浏览器下载授权与审计事务
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_download_ticket_audit.py
      - name: 验证作业终态审计与取消竞争
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_job_completion.py
      - name: 验证日志作业进程崩溃与执行租约恢复
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_log_job_recovery.py
      - name: 验证资源模板账户审计事务与幂等恢复
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_audited_mutations.py
      - name: 验证资源地址并发唯一与事务回滚
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_resource_address.py
      - name: 验证手动设备认证历史与审计原子提交
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_manual_authentication_audit.py
      - name: 验证认证退避与设备恢复事务
        # 独立随机库覆盖分级退避、手动认证和恢复竞争，脚本结束自动回收库与临时目录。
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_resource_health_transactions.py
      - name: 验证管理配置正式接口审计回滚与来源权限
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_admin_audit_transactions.py
      - name: 验证任务控制并发幂等与审计事务
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_task_control_transactions.py
      - name: 验证任务编辑暂停竞争与审计事务
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_task_edit_transactions.py
      - name: 验证登录退出改密会话与审计事务
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_session_transactions.py
      - name: 验证审计事件派生筛选与分页
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_event_queries.py
      - name: 验证管理事件游标混合主键与真实查询扫描量
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_event_cursor.py
      - name: 验证运行事件时间回填与索引排序
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_runtime_event_time.py
      - name: 验证核心转储读者与到期回收互斥
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_coredump_readers.py
      - name: 验证同资源核心转储监控单路归属
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_coredump_monitor_ownership.py
      - name: 验证核心转储导出与配额清理
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_coredump_export_workflow.py
      - name: 验证孤立核心转储副本回收与源文件保护
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_coredump_orphans.py
      - name: 验证真实数据库日志目录尾部水位
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml exec -T api python < scripts/verify_catalog_watermarks.py
      - name: 验证多路真实协议分卷与归档完整性
        run: |
          gateway="$(docker network inspect camera-log-ci_camera-logs --format '{{(index .IPAM.Config 0).Gateway}}')"
          python scripts/benchmark_service.py --url http://127.0.0.1:15173 --device-host "$gateway" --bind-host 0.0.0.0 --routes 8 --seconds 60 --realtime-clients-per-route 1 --search-interval 5 --output .local/service-benchmark-ci
      - name: 收集容器诊断日志
        if: failure()
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml logs --no-color --tail 150 api worker mongo-init frontend
      - name: 清理隔离容器与测试卷
        if: always()
        # 完整平台默认启用认证，清理项目专属副本集与日志测试卷。
        run: docker compose --env-file .env --project-name "$COMPOSE_PROJECT_NAME" --file deploy/docker-compose.yml down --volumes --remove-orphans
  component-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 使用公网 PyPI 构建组件镜像
        run: echo "PIP_INDEX_URL=https://pypi.org/simple" >> "$GITHUB_ENV"; echo "PIP_TRUSTED_HOST=pypi.org" >> "$GITHUB_ENV"
      - name: 验证 Linux 独立组件部署
        run: python scripts/verify_component_deployment.py --timeout 240
  native-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 验证 Ubuntu 无 Docker 原生服务部署
        run: sudo --preserve-env=PATH bash scripts/verify_native_deployment.sh --timeout 300
  nfs-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Linux 内核 NFS 服务及客户端
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nfs-kernel-server nfs-common
      - name: 验证真实 NFS 挂载和并行文件传输
        run: |
          set -o pipefail
          sudo "$(command -v python)" scripts/verify_nfs_service.py | tee nfs-verification.jsonl
      - name: 保存 NFS 验证结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfs-verification
          path: nfs-verification.jsonl
          if-no-files-found: ignore
